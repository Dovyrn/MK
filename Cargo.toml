[package]
name = "mk"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "xtask"]
default-members = ["."]

[features]
default = []
validation = []
vk = ["dep:ash"]
mtl = [
    "dep:block2",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-core-foundation",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
    "dep:objc2-core-graphics",
    "dep:dispatch2",
]
gl = ["dep:glow"]
jni = ["dep:jni"]
sdl = ["dep:sdl3-sys"]

[dependencies]
ash = { version = "0.38", optional = true }
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-core-foundation = { version = "0.3", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-quartz-core = { version = "0.3", optional = true, features = [
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-metal",
] }
objc2-core-graphics = { version = "0.3", optional = true, features = ["CGColorSpace"] }
dispatch2 = { version = "0.3", optional = true }
glow = { version = "0.17", optional = true }
jni = { version = "0.21", optional = true }
sdl3-sys = { version = "0.7", optional = true }

[dev-dependencies]
khronos-egl = { version = "6", features = ["dynamic"] }
png = "0.17"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "model"
required-features = ["sdl"]

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", features = ["preserve_order"] }

[profile.dev]
split-debuginfo = "packed"
