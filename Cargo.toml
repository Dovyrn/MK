[package]
name = "mk"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
vk = []
mtl = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal", "dep:dispatch2"]
gl = []

[dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-metal = { version = "0.3", optional = true }
dispatch2 = { version = "0.3", optional = true }

[build-dependencies]
toml = "0.8"

[[example]]
name = "compute"
required-features = ["mtl"]
